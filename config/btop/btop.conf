# ============================================================
# btop.conf — ala By-LeyzS (TTY minimal) + warna dari pywal
# Tema warna: ~/.cache/wal/btopwal.theme (otomatis dari wallpaper)
# ============================================================

# Tema: pakai hasil generate pywal (btopwal.theme), background transparan
# agar glassmorphism picom terlihat di baliknya.
color_theme = "/home/suo/.cache/wal/btopwal.theme"
theme_background = False

# Tampilan ala By-LeyzS: minimal, kompak
update_ms = 2000
proc_sorting = "cpu lazy"
graph_symbol = "braille"
shown_boxes = "cpu mem net proc"
update_check_ms = 0

# Urutan kolom proses
columncontainer
column_0 = "pid"
column_1 = "name"
column_2 = "cpu"

# Scroll & filter
proc_filter_kernel = True
show_disks = True

# Hemat: matikan notifikasi update
net_download_below = True
