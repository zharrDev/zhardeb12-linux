-- ============================================================================
--  anime-glass.conf — widget info sistem (CPU, RAM, DISK, jam, tanggal, dll)
--  Posisi  : kiri-tengah desktop, bentuk kartu glass (rounded, transparan)
--  Warna   : otomatis mengikuti wallpaper via pywal (~/.cache/wal/colors)
--            fallback = palet wallpaper anime default
--  Dipakai  : conky -c ~/.config/conky/anime-glass.conf
-- ============================================================================

local HOME = os.getenv('HOME')

-- Baca 16 warna dari pywal (baris: #rrggbb)
local function wal_colors()
    local cols = {}
    local f = io.open(HOME .. '/.cache/wal/colors', 'r')
    if f then
        for line in f:lines() do
            local c = line:match('^%s*#([0-9a-fA-F]+)%s*$')
            if c and #c == 6 then cols[#cols + 1] = c end
        end
        f:close()
    end
    if #cols < 16 then -- fallback: palet wallpaper default (merah/pink anime)
        cols = {'0a040a','F3254A','9B6C6D','AD7F7F','8B847B','A69E94','D4BEB2','c1c0c1','665366','F3254A','9B6C6D','AD7F7F','8B847B','A69E94','D4BEB2','c1c0c1'}
    end
    return cols
end

local C = wal_colors()

conky.config = {
    background = true,
    update_interval = 1,
    double_buffer = true,

    own_window = true,
    own_window_type = 'dock',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    draw_borders = false,
    draw_outline = false,
    draw_shades = false,

    use_xft = true,
    xftalpha = 1,

    alignment = 'top_left',
    gap_x = 32,
    gap_y = 230,

    minimum_width = 340,
    maximum_width = 340,
    minimum_height = 620,

    default_color = '#' .. C[7],
    color0 = '#' .. C[1],
    color1 = '#' .. C[2],
    color2 = '#' .. C[6],

    lua_load = HOME .. '/.config/conky/anime-glass.lua',
    lua_draw_hook_post = 'conky_draw_card',
}

conky.text = [[ ]]