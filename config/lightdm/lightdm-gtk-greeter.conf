# LightDM GTK+ Configuration — Anime Glass (By-LeyzS port)
# ============================================================
# Tema: anime-glass-greeter (custom theme for greeter only)
# Icons: papirus-dark (glass theme)
# Background: anime landscape (purple-nature.png) from user's home
# Avatar: anime-avatar.png (sync with wallpaper, in user's home)
# ============================================================

[greeter]
# Background anime (from user's home, same as desktop wallpaper)
background=/home/suo/Pictures/Wallpapers/Anime/purple-nature.png
# User avatar sync with wallpaper (generated by update-wallpaper.sh)
default-user-image=/home/suo/.config/conky/anime-avatar.png
# Custom theme for greeter only (so we can apply glass CSS without affecting desktop theme)
theme-name=anime-glass-greeter
# Icon theme — papirus-dark (glass theme, matches xfce4 setup)
icon-theme-name=Papirus-Dark
# Font
font-name=Roboto 11
# Position login box (sedikit di bawah center, ala By-LeyzS)
position=50%,center 68%,center
# Panel indicators — minimal ala By-LeyzS (host | clock | session | power)
indicators=~host;~spacer;~clock;~spacer;~session;~power
# Clock format — 12h dengan ikon matahari/bintang
clock-format=%H:%M
# Panel position
panel-position=top
# Transition durasi (cepat)
transition-duration=200
# User background = false (pakai background yang didefinisikan, bukan wallpaper user)
user-background=false
# Hide user image (to show our custom avatar)
hide-user-image=false