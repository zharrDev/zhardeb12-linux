# LightDM GTK+ Configuration — Anime Glass (By-LeyzS port)
# ============================================================
# Tema: anime-glass-greeter (custom theme for greeter only)
# Icons: Tela-circle-blue-dark (senada desktop, folder biru)
# Background: wallpaper anime login (diisi oleh scripts/apply-lightdm-greeter.sh)
# Placeholder __LOGIN_BG__ & __USER__ diganti otomatis saat deploy.
# ============================================================

[greeter]
# Background anime landscape (system path, readable oleh user lightdm)
background=__LOGIN_BG__
# Custom theme for greeter only (glass CSS tanpa mengganggu tema desktop)
theme-name=anime-glass-greeter
# Icon theme — senada desktop
icon-theme-name=Tela-circle-blue-dark
# Font — Inter (senada UI desktop)
font-name=Inter 10
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
# Posisi kartu login (sedikit di bawah center, ala By-LeyzS)
position=50%,center 68%,center
# Panel indicators — minimal ala By-LeyzS (host | clock | session | power)
indicators=~host;~spacer;~clock;~spacer;~session;~power
# Jam + hari/tanggal (Indonesia)
clock-format=%A, %d %B %Y  •  %H:%M
# Panel posisi
panel-position=top
# Background user tidak dipakai (pakai background yang didefinisikan)
user-background=false
hide-user-image=false
