# LightDM GTK+ Configuration — Anime Glass (v4 "Frosted Aurora")
# ==================================================================
# Tema    : anime-glass-greeter (kartu kaca buram, di TENGAH layar)
# Ikon    : Tela-circle-blue-dark (senada desktop, folder biru)
# Avatar  : anime-glass-avatar.png (dipasang oleh scripts/apply-lightdm-greeter.sh)
# Latar   : wallpaper anime login (juga sumber tekstur blur kartu & panel)
# Baris bertanda placeholder diganti otomatis saat deploy oleh script.
# ==================================================================

[greeter]
# Latar anime landscape (path system, bisa dibaca user lightdm)
background=__LOGIN_BG__
# Tema greeter khusus (CSS glass, tidak mengganggu tema desktop)
theme-name=anime-glass-greeter
# Ikon — senada desktop
icon-theme-name=Tela-circle-blue-dark
# Font — Inter (senada UI desktop), sedikit lebih besar dari default
font-name=Inter 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
# Posisi kartu login: 50% (tengah horizontal) + center (tengah vertikal)
position=50%,center
# Indikator panel: host | jam | session | power (minimalis ala By-LeyzS)
indicators=~host;~spacer;~clock;~spacer;~session;~power
# Jam + hari/tanggal dalam Bahasa Indonesia
clock-format=%A, %d %B %Y  •  %H:%M
# Panel menempel di tepi atas
panel-position=top
# Jangan pakai wallpaper user (pakai background di atas)
user-background=false
# Tampilkan avatar user
hide-user-image=false
default-user-image=__AVATAR__
