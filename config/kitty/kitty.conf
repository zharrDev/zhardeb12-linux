# ============================================================
# kitty.conf — port dari By-LeyzS-Arch-Hyprland-Dotfiles
# Style: minimal, opacity 0.6, cursor beam + trail, pywal
# ============================================================

# Color scheme — warna otomatis dari wallpaper (pywal)
include ~/.cache/wal/colors-kitty.conf

# Font settings (ala By-LeyzS)
font_family JetBrains Mono
bold_font JetBrains Mono Bold
italic_font JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size 11.0

# Background and transparency — 0.6 ala By-LeyzS
# (blur di belakang ditangani picom)
background_opacity 0.6
dynamic_background_opacity yes

# Window settings
confirm_os_window_close 0

# Cursor settings — beam + trail (khas By-LeyzS)
cursor_shape beam
cursor_trail 1

# Shell
shell /bin/bash

# Window padding ala By-LeyzS
window_padding_width 5 10

# Remote control (ala By-LeyzS)
allow_remote_control yes
listen_on unix:/tmp/mykitty

# Estetika
hide_window_decorations titlebar-only
tab_bar_style powerline
background_tint 0.0
