# ============================================================================
# picom-lowmem.conf — Minimal effects for low RAM/GPU systems (Intel UHD)
# ============================================================================
# Based on picom.conf but removes blur/shadow to reduce GPU/system RAM usage
# for Intel integrated graphics (shares system RAM)

# Backend: glx (GPU) atau egl (lebih ringan). Ganti ke egl bila GPU
# mendukung & glx bermasalah.
backend = "glx";

# vsync on (hindari tearing)
vsync = true;

# ------------------------------------------------------------
# Rounded corners
# ------------------------------------------------------------
# Border radius 5px (reduced from 10) — masih membulat tapi lebih hemat
corner-radius = 5;
# Radius eksplisit per-class
corner-radius-rules = [
  "5:class_g = 'xfwm4'",
  "5:class_g = 'Xfce4-terminal'",
  "5:class_g = 'xfce4-terminal'",
  "5:class_g = 'kitty'",
  "5:class_g = 'thunar'",
  "5:class_g = 'Thunar'",
  "5:class_g = 'xfce4-settings-manager'",
  "5:class_g = 'Xfce4-settings-manager'"
];
# Panel Xfce juga diberi radius via compositor (pill) — selain CSS 15px-nya.
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'tooltip'",
  "window_type = 'notification'",
  "class_g = 'Firefox' || class_g = 'firefox'",
  "fullscreen = true",
  "maximized = true"
];
detect-rounded-corners = false;

# ------------------------------------------------------------
# Shadow (bayangan)
# ------------------------------------------------------------
# OFF — bayangan tidak di-render lagi (hemat GPU)
shadow = false;
shadow-radius = 0;
shadow-opacity = 0.0;
shadow-offset-x = 0;
shadow-offset-y = 0;
shadow-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "window_type = 'menu'",
  "window_type = 'tooltip'",
  "window_type = 'notification'",
  "name = 'xfce4-notifyd'",
  "class_g = 'Plank'"
];

# ------------------------------------------------------------
# Transparansi jendela (opacity)
# ------------------------------------------------------------
# Semua jendela aplikasi SELALU solid (1.0) — tidak ada lagi efek
# semi-transparan + blur di Firefox/Thunar/aplikasi lain.
# Transparansi hanya dari aplikasi yang mengaturnya sendiri
# (terminal TRANSPARENT, panel, conky).
active-opacity = 1.0;
inactive-opacity = 1.0;
inactive-opacity-override = true;

# ------------------------------------------------------------
# Transparansi & blur untuk panel & aplikasi
# ------------------------------------------------------------
# Panel Xfce: semi-transparan (rgba(30,30,46,0.78)) — warna
# diatur oleh pywal (lihat update-wallpaper.sh).
# Terminal xfce4-terminal: transparan (backgroundmode=transparent,
# backgrounddarkness=0.82) — blur DI NONAKTIFKAN di sini.
# Conky anime-glass: kartu glass tetap tetap transparan tapi TANPA blur.
# Firefox / Thunar / aplikasi solid: TANPA blur & shadow — bersih.
# Plank (dock bawah): TANPA blur — tampil polos sesuai temanya.
# ------------------------------------------------------------
# Blur background (di balik jendela transparan) — TOTALY OFF
# ------------------------------------------------------------
# Blur background MATI — hemat GPU RAM & CPU sekaligus
blur-background = false;
blur-background-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "window_type = 'menu'",
  "window_type = 'tooltip'",
  "window_type = 'notification'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'toolbar'",
  "window_type = 'splash'",
  "class_g = 'Plank'",
  "class_g = 'plank'",
  "name = 'plank'"
];
# Tidak perlu setting blur-method atau blur-strength karena blur-background = false

# ------------------------------------------------------------
# Penghematan (hemat CPU)
# ------------------------------------------------------------
mark-wmwin-focused = true;
mark-ovredir-focused = true;
use-damage = true;
unredir-if-possible = true;         # fullscreen & idle: matikan compositing
unredir-if-possible-exclude = [
  "name = 'xfce4-panel'",
  "class_g = 'xfce4-panel'"
];

# ------------------------------------------------------------
# Fine-tuning (opsional)
# ------------------------------------------------------------
# - Semua efek visual berat (blur, shadow) dinonaktifkan
# - Hanya transparan dasar + rounded corners ringan
# - Cocok untuk sistem RAM terbatas (4GB) dengan GPU terintegrasi