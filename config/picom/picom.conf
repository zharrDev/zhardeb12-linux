# ============================================================
# picom.conf — Glassmorphism ringan untuk Xfce (Debian 12)
# Kompatibel dengan picom 10.2 (bookworm).
#
# Prinsip: efek halus, transparansi & blur, tapi hemat CPU/RAM.
# ------------------------------------------------------------
# Semua window (termasuk Firefox, terminal, file manager, panel,
# aplikasi lain) akan tampil transparan/blur/jika diatur di sini.
# ------------------------------------------------------------
# Catatan:
#   - xfwm4 compositor DIMATIK (use_compositing=false) agar picom
#     satu-satunya compositor yang aktif. Ini menghindari konflik.
#   - Panel Xfce & aplikasi lain (Firefox, terminal, Thunar, dll)
#     akan ikut terbaca blur/transparan oleh picom.
#   - Rounded corners & shadow aktif untuk semua window (kecuali
#     fullscreen/maximized/desktop).
#   - blur-background aktif untuk jendela transparan.
#   - Komposisi ringan: vsync, use-damage, mark-wmwin-focused,
#     unredir-if-possible (fullscreen & idle).
# ------------------------------------------------------------

# Backend: glx (GPU) atau egl (lebih ringan). Ganti ke egl bila GPU
# mendukung & glx bermasalah.
backend = "glx";

# vsync on (hindari tearing)
vsync = true;

# ------------------------------------------------------------
# Rounded corners
# ------------------------------------------------------------
# Rounded corners halus (termasuk panel jadi bentuk pill lembut)
# Latar belakang panel semi-transparan (rgba(30,30,46,0.78)) — warna diatur oleh pywal.
# Panel length 480px, ukuran 44px, icon-size 16.
corner-radius = 10;
# Pill panel: rounded corners & border halus
# Picom men-drag semua window (termasuk panel). Dengan corner-radius diatas,
# panel akan tampil rounded (pill halus). Panel semi-transparan (rgba(30,30,46,0.78))
# — warna diatur oleh pywal.
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'tooltip'",
  "window_type = 'notification'",
  "fullscreen = true",
  "maximized = true"
];
detect-rounded-corners = true;

# ------------------------------------------------------------
# Shadow (bayangan)
# ------------------------------------------------------------
# OFF — tidak ada bayangan/glow gelap di sekitar jendela aplikasi
# (Firefox, Thunar, dll) agar tampilan bersih tanpa "halo blur".
# Window dekoratif (conky/panel) sudah punya style sendiri.
shadow = false;
shadow-radius = 10;
shadow-opacity = 0.22;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "window_type = 'menu'",
  "window_type = 'tooltip'",
  "window_type = 'notification'",
  "name = 'xfce4-notifyd'",
  "class_g = 'Plank'"
];

# ------------------------------------------------------------
# Pill panel: rounded corners & border halus
# ------------------------------------------------------------
# Picom otomatis men-drag semua window (termasuk panel). Dengan
# corner-radius & rounded-corners-exclude diatas, panel akan tampil
# rounded (pill halus). Panel semi-transparan (rgba(30,30,46,0.78))
# — warna diatur oleh pywal.
#
# ------------------------------------------------------------


# ------------------------------------------------------------
# Transparansi jendela (opacity)
# ------------------------------------------------------------
# Semua jendela aplikasi SELALU solid (1.0) — tidak ada lagi efek
# semi-transparan + blur di Firefox/Thunar/aplikasi lain.
# Transparansi hanya dari aplikasi yang mengaturnya sendiri
# (terminal TRANSPARENT, panel, conky).
active-opacity = 1.0;
inactive-opacity = 1.0;
inactive-opacity-override = true;

# ------------------------------------------------------------
# Transparansi & blur untuk panel & aplikasi
# ------------------------------------------------------------
# Picom otomatis men-drag semua window (termasuk panel, file manager,
# terminal, Firefox, dll). Jadi panel & aplikasi lain akan tampil
# transparan/blur sesuai pengaturan di atas.
#
# Catatan:
#   - Panel Xfce: semi-transparan (rgba(30,30,46,0.78)) — warna
#     diatur oleh pywal (lihat update-wallpaper.sh).
#   - Terminal xfce4-terminal: transparan (backgroundmode=transparent,
#     backgrounddarkness=0.82) — blur di balik terminal.
#   - Firefox & aplikasi GTK: transparan/blur sesuai pengaturan picom.
#   - File manager (Thunar): ikut terbaca transparan/blur.
#
# ------------------------------------------------------------


# ------------------------------------------------------------
# Blur background (di balik jendela transparan)
# ------------------------------------------------------------
# Blur HANYA untuk elemen glass yang benar-benar transparan:
# terminal, panel chip, conky. Jendela aplikasi solid (Firefox,
# Thunar, dll) dan dock Plank TIDAK kena blur — tidak ada lagi
# area blur di sekitar jendela.
blur-background = true;
blur-background-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "window_type = 'menu'",
  "window_type = 'tooltip'",
  "window_type = 'notification'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'toolbar'",
  "window_type = 'splash'",
  "class_g = 'Plank'",
  "class_g = 'plank'",
  "name = 'plank'"
];
blur-method = "dual_kawase";        # halus + lebih hemat dari gaussian
blur-strength = 4;                  # kecil = blur tipis (hemat GPU)
# Catatan: picom hanya me-render blur pada window yang punya region
# transparan (alpha). Jendela solid (Firefox, Thunar) otomatis tidak
# kena blur — dipertegas dengan shadow=off + opacity=1.0 di atas.

# ------------------------------------------------------------
# Penghematan (hemat CPU)
# ------------------------------------------------------------
mark-wmwin-focused = true;
mark-ovredir-focused = true;
use-damage = true;
unredir-if-possible = true;         # fullscreen & idle: matikan compositing

# ------------------------------------------------------------
# Catatan transparansi & blur
# ------------------------------------------------------------
# - Terminal xfce4-terminal: transparan (BackgroundMode=TRANSPARENT)
#   — blur kaca tetap ada DI BALIK TERMINAL.
# - Panel Xfce (chip ala By-LeyzS): transparan via gtk.css — chip
#   tetap dapat blur kaca.
# - Conky anime-glass: kartu glass tetap blur.
# - Firefox / Thunar / aplikasi solid: TANPA blur & shadow — bersih.
# - Plank (dock bawah): TANPA blur — tampil polos sesuai temanya.
# ------------------------------------------------------------
# Fine-tuning (opsional)
# ------------------------------------------------------------
# - Jika ingin blur lebih kuat, naikkan blur-strength (hati-hati GPU).
# - Jika ingin shadow kembali, set shadow=true (hapus exclude app).
# - Jika ingin rounded corners, corner-radius sudah aktif (14).
#
