# ============================================================
# picom.conf — Glassmorphism ringan untuk Xfce (Debian 12)
# Kompatibel dengan picom 10.2 (bookworm).
# Prinsip: efek halus tapi hemat CPU/RAM.
# ============================================================

# Backend: glx cukup ringan; egl bisa dipakai bila GPU mendukung
backend = "glx";

# Sinkronisasi vsync (hindari tearing)
vsync = true;

# ----- Rounded corners (sudut membulat) -----
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'tooltip'",
  "window_type = 'notification'",
  "fullscreen = true",
  "maximized = true"
];
detect-rounded-corners = true;

# ----- Shadow (bayangan halus, kecil) -----
shadow = true;
shadow-radius = 10;
shadow-opacity = 0.22;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-exclude = [
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'tooltip'",
  "window_type = 'notification'",
  "name = 'xfce4-notifyd'"
];

# ----- Transparansi jendela -----
active-opacity = 1.0;
inactive-opacity = 0.94;          # jendela tidak aktif sedikit transparan
inactive-opacity-override = false;

# ----- Blur tipis di belakang jendela transparan (terminal) -----
blur-background = true;
blur-background-exclude = [
  "window_type = 'desktop'"
];
blur-method = "dual_kawase";      # halus + lebih hemat dari gaussian
blur-strength = 4;                # kecil = blur tipis (hemat GPU)

# ----- Penghematan -----
# Jangan render ulang saat jendela diam (hemat CPU)
mark-wmwin-focused = true;
mark-ovredir-focused = true;
use-damage = true;
unredir-if-possible = true;       # fullscreen = tanpa compositing (hemat daya)